name: Deploy OpenBreak to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The lockfile was generated on macOS and can omit npm's platform-specific
      # optional native packages. Install the Ubuntu x64 binaries explicitly.
      - name: Install Linux native build dependencies
        run: |
          npm install --no-save \
            @rollup/rollup-linux-x64-gnu@$(node -p "require('./node_modules/rollup/package.json').version") \
            @esbuild/linux-x64@$(node -p "require('./node_modules/esbuild/package.json').version")
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
